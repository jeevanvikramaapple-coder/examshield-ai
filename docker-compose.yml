services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: examshield
      POSTGRES_PASSWORD: examshield
      POSTGRES_DB: examshield
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examshield"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes: [evidence:/srv/evidence]
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  evidence:
